<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090712">
  <meta name="description" content="Rektopuss Media — tiešraides, sociālie tīkli un bonusi.">
  <link rel="icon" href="assets/icons/rektopuss.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>Rektopuss Media</title>
  <style>
    :root { --ink:#f8f7fc; --muted:#9993a1; --line:rgba(255,255,255,.075); }
    * { box-sizing:border-box; }
    html { min-width:320px; background:#090712; }
    body { min-height:100vh; margin:0; color:var(--ink); background:radial-gradient(ellipse 78% 50% at 25% 5%,#23163e 0%,rgba(31,19,53,.62) 24%,transparent 59%),radial-gradient(ellipse 76% 68% at 89% 95%,#151331 0%,transparent 60%),#090712; font-family:Manrope,Arial,sans-serif; }
    .page { width:min(100% - 32px,520px); min-height:100vh; margin:auto; padding:48px 0 72px; }
    .hero { text-align:center; }
    .logo { display:block; width:52px; height:52px; object-fit:contain; margin:0 auto 5px; filter:brightness(0) invert(1) drop-shadow(0 3px 8px rgba(0,0,0,.25)); }
    .brand { display:block; font-size:12px; font-weight:800; letter-spacing:-.055em; }
    h1 { margin:34px 0 0; background:linear-gradient(100deg,#ae78ff 0%,#9a52ee 52%,#7d34cb 100%); -webkit-background-clip:text; background-clip:text; color:transparent; font:800 56px/.8 "Barlow Condensed",Impact,sans-serif; letter-spacing:.005em; text-transform:uppercase; }
    h1 span { display:block; margin-top:4px; background:linear-gradient(100deg,#ae78ff 0%,#9a52ee 52%,#7d34cb 100%); -webkit-background-clip:text; background-clip:text; color:transparent; font-size:.82em; }
    .lead { margin:16px 0 0; color:#a19ba9; font-size:14px; }
    .bonus-link { display:grid; grid-template-columns:54px minmax(0,1fr) 20px; align-items:center; gap:14px; min-height:72px; margin-top:32px; padding:9px 18px 9px 9px; border:1px solid rgba(163,85,239,.35); border-radius:11px; color:var(--ink); background:linear-gradient(105deg,rgba(43,28,62,.9),rgba(24,19,35,.8)); box-shadow:0 8px 18px rgba(0,0,0,.13); text-align:left; text-decoration:none; transition:transform .18s ease,background .18s ease,border-color .18s ease; animation:bonus-glow 3.8s ease-in-out infinite; }
    .bonus-link:hover,.bonus-link:focus-visible,.social:hover,.social:focus-visible { border-color:rgba(181,111,255,.7); background:rgba(49,34,68,.94); outline:0; transform:translateY(-2px); }
    .bonus-mark { display:grid; place-items:center; width:54px; height:54px; border-radius:8px; background:linear-gradient(145deg,#b770ff,#722ee0); font:800 34px/.8 "Barlow Condensed",sans-serif; }
    .card-title { display:block; font-size:14px; font-weight:800; line-height:1.28; letter-spacing:-.035em; }
    .card-subtitle { display:block; margin-top:4px; color:#aaa0b4; font-size:12px; }
    .arrow { color:#aaa5b3; font-size:28px; font-weight:300; line-height:1; }
    .section-title { margin:34px 0 11px; color:#a69faf; font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; }
    .socials { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .social { display:flex; align-items:center; gap:11px; min-height:60px; padding:10px; border:1px solid var(--line); border-radius:11px; color:var(--ink); background:linear-gradient(105deg,rgba(31,30,40,.92),rgba(20,19,29,.78)); text-decoration:none; transition:transform .18s ease,background .18s ease,border-color .18s ease; }
    .social img { width:30px; height:30px; padding:6px; border-radius:6px; background:rgba(255,255,255,.05); filter:brightness(0) invert(1); }
    .social span { font-size:13px; font-weight:800; letter-spacing:-.035em; }
    footer { margin-top:40px; color:#847e8d; font-size:11px; line-height:1.8; text-align:center; }
    footer a { color:inherit; }
    footer p { margin:0; }
    footer p + p { margin-top:2px; }
    @keyframes bonus-glow { 50% { border-color:rgba(181,111,255,.62); box-shadow:0 8px 23px rgba(128,56,221,.2); } }
    @media (prefers-reduced-motion:reduce) { .bonus-link { animation:none; } }
    @media (max-width:390px) { .page { width:min(100% - 24px,520px); } .card-title { font-size:13px; } .card-subtitle { font-size:11px; } .social span { font-size:12px; } }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero" aria-labelledby="page-title">
      <img class="logo" src="assets/images/branding/rektopuss.png" alt="">
      <span class="brand">REKTOPUSS MEDIA</span>
      <h1 id="page-title">Pieseko mums</h1>
      <p class="lead">Tiešraides, jaunumi un īpašie piedāvājumi vienuviet.</p>
    </section>

    <a class="bonus-link" href="bonusi/index.html">
      <span class="bonus-mark" aria-hidden="true">%</span>
      <span><span class="card-title">Bonusi un atlaides</span><span class="card-subtitle">Īpašie piedāvājumi mūsu skatītājiem</span></span><span class="arrow" aria-hidden="true">›</span>
    </a>

    <p class="section-title">Seko Rektopuss Media</p>
    <nav class="socials" aria-label="Rektopuss Media sociālie tīkli">
      <a class="social" href="https://t.me/rektopuss" target="_blank" rel="noopener noreferrer"><img src="assets/icons/brand-telegram.svg" alt=""><span>Telegram</span></a>
      <a class="social" href="https://www.youtube.com/@RektopussMedia" target="_blank" rel="noopener noreferrer"><img src="assets/icons/brand-youtube.svg" alt=""><span>YouTube</span></a>
      <a class="social" href="https://www.tiktok.com/@rektopussMedia" target="_blank" rel="noopener noreferrer"><img src="assets/icons/brand-tiktok.svg" alt=""><span>TikTok</span></a>
      <a class="social" href="https://www.twitch.tv/rektopuss_official" target="_blank" rel="noopener noreferrer"><img src="assets/icons/brand-twitch.svg" alt=""><span>Twitch</span></a>
      <a class="social" href="https://kick.com/rektopuss" target="_blank" rel="noopener noreferrer"><img src="assets/icons/brand-kick.svg" alt=""><span>Kick</span></a>
      <a class="social" href="https://www.instagram.com/rektopussmedia" target="_blank" rel="noopener noreferrer"><img src="assets/icons/brand-instagram.svg" alt=""><span>Instagram</span></a>
      <a class="social" href="https://www.facebook.com/RektopussMedia" target="_blank" rel="noopener noreferrer"><img src="assets/icons/brand-facebook.svg" alt=""><span>Facebook</span></a>
      <a class="social" href="https://lv.wikipedia.org/wiki/Rektopuss" target="_blank" rel="noopener noreferrer"><img src="assets/icons/brand-wikipedia.svg" alt=""><span>Vikipēdija</span></a>
    </nav>

    <footer><p>© Rektopuss Media</p><p>18+ | <a href="https://azartaatkariba.lv/" target="_blank" rel="noopener noreferrer">Spēlē atbildīgi.</a></p></footer>
  </main>
</body>
</html>
